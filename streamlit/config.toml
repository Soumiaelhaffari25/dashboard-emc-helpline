New-Item -ItemType Directory -Force -Path .streamlit | Out-Null
@"
[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#3E6668"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"

[theme.dark]
primaryColor = "#3E6668"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"

[theme.dark.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
"@ | Set-Content -Path .streamlit/config.toml -Encoding UTF8